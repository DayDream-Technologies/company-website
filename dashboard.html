<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard | DayDream Technologies</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="./src/css/navbar.css" />
    <link rel="stylesheet" href="./src/css/main.css" />
    <link rel="stylesheet" href="./src/css/auth.css" />
    <link rel="stylesheet" href="./src/css/dashboard.css" />
    <link rel="stylesheet" href="./src/css/footer.css" />
    <link rel="icon" href="./src/images/favicon.ico" />
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="./src/js/config.js"></script>
    <script src="./src/js/supabase-client.js"></script>
    <script src="./src/js/portal-format.js"></script>
    <script src="./src/js/auth.js"></script>
    <script src="./src/js/dashboard/billing.js"></script>
    <script src="./src/js/dashboard/app.js"></script>
    <script src="./src/js/main.js" defer></script>
</head>
<body>
    <nav>
        <ul class="links">
            <li>
                <a class="nav_logo" href="/">
                    <img class="logo_img" src="./logos/star-moon-logo-right.png" alt="Day Dream Technologies" />
                </a>
            </li>
            <div class="nav_links">
                <li><a class="nav_link" href="/" title="Daydream's homepage">Home</a></li>
                <li><a class="nav_link" href="/services" title="Our services">Services</a></li>
                <li><a class="nav_link" href="/projects" title="Our projects">Projects</a></li>
                <li><a class="nav_link" href="/nonprofits" title="Nonprofit services">Nonprofits</a></li>
                <li><a class="nav_link" href="/contact" title="Contact us">Contact</a></li>
                <li><a class="nav_link" data-nav-auth href="/dashboard" title="Client dashboard">Dashboard</a></li>
            </div>
        </ul>
        <ul class="respo_navbar">
            <li>
                <a class="nav_logo" href="/">
                    <img class="logo_img" src="./logos/star-moon-logo-right.png" alt="Day Dream Technologies" />
                </a>
            </li>
            <li>
                <label class="hamburger">
                    <input type="checkbox">
                    <svg viewBox="0 0 32 32">
                        <path class="line line-top-bottom" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path>
                        <path class="line" d="M7 16 27 16"></path>
                    </svg>
                </label>
            </li>
        </ul>
        <ul class="dropdown">
            <li><a class="nav_link" href="/">Home</a></li>
            <li><a class="nav_link" href="/services">Services</a></li>
            <li><a class="nav_link" href="/projects">Projects</a></li>
            <li><a class="nav_link" href="/nonprofits">Nonprofits</a></li>
            <li><a class="nav_link" href="/contact">Contact</a></li>
            <li><a class="nav_link" data-nav-auth href="/dashboard">Dashboard</a></li>
        </ul>
    </nav>

    <main class="portal">
        <header class="portal-header">
            <div>
                <p class="portal-kicker">Client portal</p>
                <h1 id="portal-greeting">Your dashboard</h1>
            </div>
            <button type="button" id="logout-button">Log out</button>
        </header>
        <p id="portal-banner" class="portal-banner" hidden></p>
        <div class="portal-tabs" role="tablist">
            <button type="button" class="portal-tab" role="tab" aria-selected="true" data-panel="panel-projects">Projects</button>
            <button type="button" class="portal-tab" role="tab" aria-selected="false" data-panel="panel-billing">Billing</button>
            <button type="button" class="portal-tab" role="tab" aria-selected="false" data-panel="panel-invoices">Invoices</button>
            <button type="button" class="portal-tab" role="tab" aria-selected="false" data-panel="panel-payments">Payments</button>
            <button type="button" class="portal-tab" role="tab" aria-selected="false" data-panel="panel-settings">Account</button>
        </div>
        <section id="panel-projects" class="portal-panel"></section>
        <section id="panel-billing" class="portal-panel" hidden></section>
        <section id="panel-invoices" class="portal-panel" hidden></section>
        <section id="panel-payments" class="portal-panel" hidden></section>
        <section id="panel-settings" class="portal-panel" hidden>
            <h2>Account settings</h2>
            <form id="settings-form" class="portal-card stack-form">
                <label class="field">Full name
                    <input id="settings-name" name="fullName" type="text" autocomplete="name" />
                </label>
                <label class="field">Company
                    <input id="settings-company" name="company" type="text" autocomplete="organization" />
                </label>
                <label class="field">Email
                    <input id="settings-email" type="email" readonly />
                </label>
                <label class="field">New password
                    <input id="settings-password" type="password" autocomplete="new-password" placeholder="Leave blank to keep your current password" />
                </label>
                <button type="submit" id="settings-submit">Save changes</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer_left">
            <a class="footer_link" href="/">
                <img class="linkdn" src="./logos/star-moon-logo-right.png" alt="Daydream Technologies" />
                DayDream Technologies
            </a>
            <p class="footer_copyright">© <span data-copyright-year>2026</span> DayDream Technologies. All rights reserved.</p>
        </div>
        <div class="footer_links">
            <a class="footer_link footer_social" target="_blank" href="https://www.linkedin.com/company/daydream-technologies/" title="Follow us on LinkedIn">
                <img src="./src/images/alt-linkedin.jpg" alt="LinkedIn" class="social-icon" />
                <span>LinkedIn</span>
            </a>
        </div>
    </footer>
</body>
</html>
