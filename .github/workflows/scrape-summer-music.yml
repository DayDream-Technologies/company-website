name: Scrape GR Summer Music

on:
  # Run bi-weekly on Sunday at 12:00 UTC (8:00 AM EDT).
  # Cron fires weekly; the bi-weekly check below skips every other week.
  # Month filtering (May–September) is handled inside the scraper via
  # isSummerDate(). Outside of summer the scraper returns empty results.
  schedule:
    - cron: '0 12 * * 0'

  # Allow manual trigger from GitHub Actions UI at any time
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check bi-weekly schedule
        id: biweekly
        if: github.event_name == 'schedule'
        run: |
          WEEK=$(date +%V)
          if [ $((WEEK % 2)) -ne 0 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping — odd week ($WEEK), runs on even weeks only"
          else
            echo "Running — even week ($WEEK)"
          fi

      - name: Checkout repository
        if: steps.biweekly.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: steps.biweekly.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.biweekly.outputs.skip != 'true'
        run: npm ci

      - name: Run scraper
        if: steps.biweekly.outputs.skip != 'true'
        run: node scripts/scrape-summer-music.js --force

      - name: Check for changes
        if: steps.biweekly.outputs.skip != 'true'
        id: check_changes
        run: |
          if git diff --quiet src/data/summer-music-events.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.biweekly.outputs.skip != 'true' && steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/summer-music-events.json src/data/geocache.json
          git commit -m "chore: update summer music events data [automated]"
          git push
